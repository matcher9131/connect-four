[package]
name = "connect-four-wasm"
version = "0.1.0"
authors = ["Your Name <you@example.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_repr = "0.1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2.99"
rand = { version = "0.10.2", default-features = false }
js-sys = "0.3.76"
# getrandom = { version = "0.4.3", features = ["wasm_js"] }

# Optional: Add these for more functionality
# console_error_panic_hook = "0.1"
# wee_alloc = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
rstest = "0.23"

[profile.release]
# Optimize for size
opt-level = "s"
lto = true
